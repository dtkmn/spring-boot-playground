name: CodeQL

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  schedule:
    - cron: '43 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        project:
          - examples/kafka-basic
          - examples/kafka-streams
          - examples/binance-websocket
          - examples/ai-mcp
          - variants/mvc-jpa/template
          - variants/webflux-r2dbc/template
          - variants/mvc-jpa/ai
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Each project gets its own database so template package names cannot collide.
      - name: Prepare composed project
        id: project
        env:
          PROJECT_DIR: ${{ matrix.project }}
        run: |
          if [[ "$PROJECT_DIR" == variants/mvc-jpa/ai ]]; then
            ./scripts/init-service.sh \
              --variant mvc-jpa --purpose ai \
              --service-name codeql-mvc-ai --group-id tech.example \
              --artifact-id codeql-mvc-ai --package-name tech.example.codeqlmvcai \
              --output-dir generated/codeql-mvc-ai
            PROJECT_DIR=generated/codeql-mvc-ai
            cat > "$PROJECT_DIR/checked-in-sources.gradle" <<'SOURCES'
          allprojects {
              afterEvaluate {
                  def starter = new File(System.getenv('STARTER_SOURCE_DIR'))
                  tasks.named('compileJava') {
                      setSource(files(fileTree(new File(starter, 'variants/mvc-jpa/template/src/main/java')) {
                          include '**/Application.java'
                      }, fileTree(new File(starter, 'variants/mvc-jpa/ai/src/main/java'))))
                  }
                  tasks.named('compileTestJava') {
                      setSource(files(fileTree(new File(starter, 'variants/mvc-jpa/template/src/test/java')) {
                          include '**/observability/**'
                      }, fileTree(new File(starter, 'variants/mvc-jpa/ai/src/test/java'))))
                  }
              }
          }
          SOURCES
            echo "source_root=." >> "$GITHUB_OUTPUT"
          else
            echo "source_root=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          fi
          echo "directory=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: java-kotlin
          build-mode: manual
          source-root: ${{ steps.project.outputs.source_root }}

      - name: Compile project for analysis
        env:
          PROJECT_DIR: ${{ steps.project.outputs.directory }}
          STARTER_SOURCE_DIR: ${{ github.workspace }}
        run: |
          source_options=()
          if [[ -f "$PROJECT_DIR/checked-in-sources.gradle" ]]; then
            source_options=(-I "$STARTER_SOURCE_DIR/$PROJECT_DIR/checked-in-sources.gradle")
          fi
          ./gradlew -p "$PROJECT_DIR" clean compileJava compileTestJava \
            "${source_options[@]}" \
            --no-daemon --no-build-cache --no-configuration-cache

      - name: Analyze Java
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:java-kotlin/project:${{ matrix.project }}

  actions:
    name: GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: actions
          build-mode: none

      - name: Analyze GitHub Actions
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:actions
