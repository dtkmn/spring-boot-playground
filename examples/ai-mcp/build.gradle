plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'tech.dtkmn.examples'
version = '0.1.0-SNAPSHOT'

ext {
    set('jackson-bom.version', '3.1.8')
    set('tomcat.version', '11.0.26')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.ai:spring-ai-bom:2.0.1'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'ollama'
    }
}

tasks.register('ollamaTest', Test) {
    description = 'Run the opt-in integration check against an already installed local Ollama model.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'ollama'
    }
    outputs.upToDateWhen { false }
    shouldRunAfter tasks.named('test')
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}
