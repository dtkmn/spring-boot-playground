services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-17}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-__ARTIFACT_ID__}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:${POSTGRES_EXPORT_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-__APP_PORT__}:__APP_PORT__"
      - "127.0.0.1:${MANAGEMENT_HOST_PORT:-__MANAGEMENT_PORT__}:__MANAGEMENT_PORT__"
    environment:
      SPRING_PROFILES_ACTIVE: ${PILOT_PROFILES:-docker}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: __APP_PORT__
      MANAGEMENT_SERVER_PORT: __MANAGEMENT_PORT__
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-__ARTIFACT_ID__}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PILOT_CALLER_A_TOKEN: ${PILOT_CALLER_A_TOKEN:?PILOT_CALLER_A_TOKEN must be set}
      PILOT_CALLER_B_TOKEN: ${PILOT_CALLER_B_TOKEN:?PILOT_CALLER_B_TOKEN must be set}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
