name: CI

permissions:
  contents: write

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Submit runtime dependency graph
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false
          dependency-graph-include-configurations: runtimeClasspath

      - name: Run deterministic quality gates
        run: ./gradlew check --no-daemon

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
            build/reports/cyclonedx/

      - name: Prepare disposable credentials and validate Compose
        run: |
          umask 077
          cp .env.example .env
          {
            echo "APP_HOST_PORT=18080"
            echo "MANAGEMENT_HOST_PORT=18081"
            echo "POSTGRES_EXPORT_PORT=15432"
            printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'PILOT_CALLER_A_TOKEN=%s\n' "$(openssl rand -hex 32)"
            printf 'PILOT_CALLER_B_TOKEN=%s\n' "$(openssl rand -hex 32)"
          } >> .env
          docker compose -f compose.yaml --env-file .env config --quiet
          docker compose -f docker-compose.yml --env-file .env config --quiet

      - name: Smoke test development path with AI off
        run: ./scripts/dev-smoke-test.sh

      - name: Smoke test packaged service with AI off
        run: ./scripts/smoke-test.sh
