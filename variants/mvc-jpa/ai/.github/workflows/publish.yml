name: Publish Image

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tag commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"

      - name: Run deterministic quality gates
        run: ./gradlew check --no-daemon

      - name: Prepare disposable credentials and validate Compose
        run: |
          umask 077
          cp .env.example .env
          {
            echo "APP_HOST_PORT=18080"
            echo "MANAGEMENT_HOST_PORT=18081"
            echo "POSTGRES_EXPORT_PORT=15432"
            printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'PILOT_CALLER_A_TOKEN=%s\n' "$(openssl rand -hex 32)"
            printf 'PILOT_CALLER_B_TOKEN=%s\n' "$(openssl rand -hex 32)"
          } >> .env
          docker compose -f compose.yaml --env-file .env config --quiet
          docker compose -f docker-compose.yml --env-file .env config --quiet

      - name: Smoke test development path with AI off
        run: ./scripts/dev-smoke-test.sh

      - name: Smoke test packaged service with AI off
        run: ./scripts/smoke-test.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Docker metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
